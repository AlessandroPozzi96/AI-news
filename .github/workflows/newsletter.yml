name: Newsletter

on:
  schedule:
    # Hourly: the pipeline reads the send window from the settings table and exits quickly when it is not due.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Generate and send a new manual issue now to all active subscribers, ignoring the schedule'
        type: boolean
        default: false

# Hourly runs never overlap. Manual runs have their own group: GitHub keeps only one pending run per group,
# so sharing it would let an hourly trigger cancel a pending "send now".
concurrency:
  group: newsletter-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline
        run: npm run pipeline -- ${{ inputs.force && '--force' || '' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
